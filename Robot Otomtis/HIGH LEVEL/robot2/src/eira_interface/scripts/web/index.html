<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Button</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    * {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .row {
      flex: 1;
      display: flex;
    }

    button {
      flex: 1;
      font-size: 2vw;

      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;

      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    button:focus {
      outline: none;
    }

    @media (max-width: 600px) {
      button {
        font-size: 5vw;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row">
      <button data-index="0">Button 1</button>
      <button data-index="1">Button 2</button>
      <button data-index="2">Button 3</button>
    </div>

    <div class="row">
      <button data-index="3">Button 4</button>
      <button data-index="4">Button 5</button>
    </div>
  </div>

  <script>
    let isPressed = false;
    let activeButton = null;
    let activePointerId = null;

    function makeButtonArray(index) {
      const data = [0, 0, 0, 0, 0];
      data[index] = 1;
      return data;
    }

    async function sendButton(dataArray) {
      try {
        await fetch("/api/button", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            btn_tictactoe: dataArray
          })
        });
      } catch (error) {
        console.log("Gagal kirim data:", error);
      }
    }

    function pressButton(event) {
      event.preventDefault();

      if (isPressed) {
        return;
      }

      const button = event.currentTarget;
      const index = Number(button.dataset.index);

      isPressed = true;
      activeButton = button;
      activePointerId = event.pointerId;

      button.setPointerCapture(activePointerId);

      sendButton(makeButtonArray(index));
    }

    function releaseButton(event) {
      event.preventDefault();

      if (!isPressed) {
        return;
      }

      if (activeButton !== null && activePointerId !== null) {
        try {
          activeButton.releasePointerCapture(activePointerId);
        } catch (error) {
          // Abaikan kalau pointer capture sudah lepas
        }
      }

      isPressed = false;
      activeButton = null;
      activePointerId = null;

      sendButton([0, 0, 0, 0, 0]);
    }

    const buttons = document.querySelectorAll("button");

    buttons.forEach((button) => {
      button.addEventListener("pointerdown", pressButton);
      button.addEventListener("pointerup", releaseButton);
      button.addEventListener("pointercancel", releaseButton);

      button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      button.addEventListener("dragstart", (event) => {
        event.preventDefault();
      });
    });

    window.addEventListener("blur", () => {
      if (isPressed) {
        isPressed = false;
        activeButton = null;
        activePointerId = null;
        sendButton([0, 0, 0, 0, 0]);
      }
    });

    window.addEventListener("beforeunload", () => {
      sendButton([0, 0, 0, 0, 0]);
    });
  </script>

</body>
</html>
